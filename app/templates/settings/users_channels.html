{# Admin settings > Users and Channels tabs. #}
    <!-- Users tab: admin-only account management, in its own tab (a separate concern from System). -->
    <div id="tab-users" class="hidden mx-auto max-w-[55.2rem] px-4 py-8 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-200">Users</h2>
        <button id="add-user-btn" type="button"
          class="rounded-lg border border-slate-700 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-800
                 transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent">
          + Add user
        </button>
      </div>
      <p id="add-user-no-models-hint" class="hidden text-xs text-warning-400">
        No models installed yet — install one on the Model tab before adding a new user.
      </p>

      <div id="add-user-form" class="hidden space-y-2 rounded-lg bg-slate-900 border border-slate-800 px-4 py-3">
        <div class="grid grid-cols-2 gap-2">
          <input id="new-user-username" type="text" placeholder="Username" autocomplete="off"
            class="rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
          <input id="new-user-password" type="password" placeholder="Password" autocomplete="new-password"
            class="rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
          <input id="new-user-first-name" type="text" placeholder="First name (optional)" autocomplete="off"
            class="rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
          <input id="new-user-last-name" type="text" placeholder="Last name (optional)" autocomplete="off"
            class="rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
          <select id="new-user-role"
            class="rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
            <option value="user">User</option>
            <option value="channel_manager">Channel manager</option>
            <option value="admin">Admin</option>
          </select>
          <select id="new-user-status"
            class="rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
            <option value="active">Active</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>
        <div class="flex items-center gap-2 pt-1">
          <button id="create-user-btn" type="button"
            class="rounded-md bg-brand-600 px-3 py-1.5 text-xs font-medium text-white hover:bg-brand-500 transition-colors">
            Create
          </button>
          <button id="cancel-add-user-btn" type="button"
            class="rounded-md border border-slate-700 px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-800 transition-colors">
            Cancel
          </button>
          <span id="add-user-status" class="text-xs text-slate-500"></span>
        </div>
      </div>

      <div id="system-user-list" class="space-y-1.5 text-sm"></div>
      <div id="system-user-pagination" class="hidden flex items-center justify-between text-xs text-slate-500">
        <button id="system-user-prev-btn" type="button"
          class="rounded-md border border-slate-700 px-2.5 py-1 text-xs text-slate-200 hover:bg-slate-800 transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent">
          Prev
        </button>
        <span id="system-user-page-info"></span>
        <button id="system-user-next-btn" type="button"
          class="rounded-md border border-slate-700 px-2.5 py-1 text-xs text-slate-200 hover:bg-slate-800 transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent">
          Next
        </button>
      </div>
    </div>

    <!-- Channels tab: admin-only. A channel is a shared group chat; its member/manager picker is built in JS (settings.js buildChannelForm) to stay usable with 1000+ users, which a plain <select> isn't. -->
    <div id="tab-channels" class="hidden mx-auto max-w-[55.2rem] px-4 py-8 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-200">Channels</h2>
        <button id="add-channel-btn" type="button"
          class="rounded-lg border border-slate-700 px-3 py-1.5 text-xs font-medium text-slate-200 hover:bg-slate-800 transition-colors">
          + Add channel
        </button>
      </div>
      <p class="text-xs text-slate-500 -mt-2">
        Every member can read and send messages in a channel; only admins and that channel's
        managers can change its model, persona, rules, or skill.
      </p>

      <div id="add-channel-form" class="hidden space-y-3 rounded-lg bg-slate-900 border border-slate-800 px-4 py-3"></div>

      <div id="channel-list" class="rounded-lg bg-slate-900 border border-slate-800 divide-y divide-slate-800 text-sm"></div>
    </div>
