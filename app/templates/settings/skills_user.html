    <!-- Settings > Skills: the user's private skills (settings_skills_user.js, /api/skills/mine). Only they see and
         use them, in their own chats; a channel uses the shared skills only. -->
    <section id="skills-user" class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-sm font-semibold text-slate-200">My skills</h2>
          <p class="text-xs text-slate-500">
            Your own skills, next to the shared ones an admin offers. Only you see them, and you choose them per chat
            with its 🛠️ icon (not in channels). A skill's instructions join the chat's system prompt.
          </p>
        </div>
        <button type="button" data-action="new" class="shrink-0 rounded-lg bg-brand-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-brand-500">New skill</button>
      </div>
      {% include "_skill_editor.html" %}
      <div data-field="list" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
