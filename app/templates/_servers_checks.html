<!-- Cluster > Servers > Checklist: what several pAIring servers on one database need, checked on every online server. Wired by app/static/js/settings_servers_checks.js to /api/settings/servers/checks (app/services/servers_check.py). -->
<section class="space-y-3" id="servers-checks">
  <h2 class="text-sm font-semibold text-slate-200">Several pAIring servers</h2>
  <p class="text-xs text-slate-500 -mt-2">
    To run pAIring on more than one machine behind a load balancer, every check below must pass. Each is checked on
    every online server.
  </p>
  <ul data-field="checks" class="space-y-2"></ul>
  <div data-field="folders-wrap" class="hidden space-y-2">
    <h3 class="text-xs font-semibold text-slate-300">Shared folders on each server</h3>
    <div class="overflow-x-auto rounded-lg border border-slate-800">
      <table class="w-full text-xs">
        <thead data-field="folders-head" class="bg-slate-900 text-slate-400"></thead>
        <tbody data-field="folders" class="divide-y divide-slate-800 text-slate-300"></tbody>
      </table>
    </div>
  </div>
</section>
